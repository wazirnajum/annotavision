<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent | AnotaVision</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .thanks{min-height:70vh;display:flex;align-items:center;justify-content:center;background:var(--navy-950);text-align:center;padding:40px 20px;}
  .thanks .box{max-width:480px;}
  .thanks .ico{width:74px;height:74px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
  .thanks .ico svg{width:34px;height:34px;color:#fff;}
  .thanks h1{color:#fff;font-size:28px;margin-bottom:12px;}
  .thanks p{color:var(--text-onlight-dim);margin-bottom:26px;}
</style>
</head>
<body>
  <section class="thanks">
    <div class="box">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h1>Message Sent Successfully</h1>
      <p>Thank you for reaching out to AnotaVision. Our team will review your message and get back to you within 24 hours at the email you provided.</p>
      <a href="index.html" class="btn btn-primary">Back to Home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </section>
</body>
</html>
